name: build
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        xwayland: [enabled, disabled]
    steps:
      - name: dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git meson ninja pkgconf \
            wayland wayland-protocols wlroots0.20 \
            libxkbcommon pixman pango cairo \
            gdk-pixbuf2
      - uses: actions/checkout@v4
      - name: build
        run: |
          meson setup build --werror -Db_sanitize=address,undefined \
            -Deffects=false -Dwallpaper=enabled \
            -Dxwayland=${{ matrix.xwayland }}
          ninja -C build
      - name: layout harness
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          printf 'vsvsvshjklHJKLHJKLhhjjkkllLLLLqvsqlkqh' | ./build/aro-layout > /dev/null
          printf 'vvssvsqqqqqqq' | ./build/aro-layout > /dev/null
      - name: aropaper
        run: ./build/aropaper --version
