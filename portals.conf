# aro — xdg-desktop-portal backend preferences
#
# Installed to /usr/share/xdg-desktop-portal/aro-portals.conf, matched
# against XDG_CURRENT_DESKTOP=aro, which the compositor sets at startup.
#
# Without this the portal has no backend for us and every out-of-process
# dialog — GTK's file chooser, screen sharing, the colour picker — hangs
# forever waiting for an answer.
#
# gtk handles everything; wlr handles screencast and screenshot properly
# for wlroots compositors, and is preferred where present.

[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr;gtk
org.freedesktop.impl.portal.ScreenCast=wlr;gtk
