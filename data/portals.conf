# aro xdg-desktop-portal backend preferences
#
# installed to /usr/share/xdg-desktop-portal/aro-portals.conf and matched
# by XDG_CURRENT_DESKTOP=aro.
#
# without this, portal dialogs may hang.
#
# gtk is the fallback. wlr is preferred for screenshot/screencast when present.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr;gtk
org.freedesktop.impl.portal.ScreenCast=wlr;gtk
