<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- aro, symbolic: one colour, for panels and trays. Focus is the filled
       lens, since there is no accent to spend. Every edge sits on the
       16px pixel grid: both lenses cover x 1-7 / 9-15, y 2-14. -->
  <rect x="1" y="2" width="6" height="12" rx="3" fill="#bebebe"/>
  <rect x="9.5" y="2.5" width="5" height="11" rx="2.5" fill="none"
        stroke="#bebebe" stroke-width="1"/>
  <!-- the bridge: a straight 1px bar; a 2px-wide arch is only a smudge -->
  <rect x="7" y="5" width="2" height="1" fill="#bebebe"/>
</svg>
