<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Fundo escuro do ícone (quadrado com cantos arredondados) -->
  <rect width="256" height="256" rx="48" fill="#0c0f13"/>

  <!-- Ponte entre as janelas -->
  <path d="M114 100 Q128 88 142 100" fill="none" stroke="#222a35" stroke-width="8" stroke-linecap="round"/>

  <!-- Janela da esquerda (Nova/Foco) -->
  <rect x="40" y="56" width="76" height="144" rx="32" fill="#161b23" stroke="#e6a54b" stroke-width="8"/>
  <rect x="48" y="64" width="60" height="128" rx="24" fill="none" stroke="#e6a54b" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Janela da direita (Velha/Sem foco) -->
  <rect x="140" y="56" width="76" height="144" rx="32" fill="#12161d" stroke="#222a35" stroke-width="8"/>
</svg>

